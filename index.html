<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B0D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Corte" />
    <title>Corte 2026</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <div class="wrap">
        <div class="hd">
          <h1>Corte <em>2026</em></h1>
          <span class="chip" id="chip-bloco">Bloco A</span>
          <span class="chip gray" id="chip-kcal">kcal</span>
        </div>
        <div class="sync">
          <span class="dot" id="sync-dot"></span>
          <span id="sync-txt"></span>
          <span style="flex: 1"></span>
          <button class="link" id="btn-conta" hidden>Entrar</button>
        </div>
        <div id="painel-conta" hidden></div>
      </div>
    </header>

    <main class="wrap">
      <section data-tela="hoje"></section>
      <section data-tela="calc" hidden></section>
      <section data-tela="peso" hidden></section>
      <section data-tela="compras" hidden></section>
    </main>

    <nav>
      <div class="wrap">
      <button data-t="hoje">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" /></svg>
        Hoje
      </button>
      <button data-t="calc">
        <svg viewBox="0 0 24 24">
          <rect x="4" y="3" width="16" height="18" rx="1" />
          <line x1="8" y1="8" x2="16" y2="8" />
          <line x1="8" y1="12" x2="10" y2="12" />
          <line x1="14" y1="12" x2="16" y2="12" />
          <line x1="8" y1="16" x2="10" y2="16" />
          <line x1="14" y1="16" x2="16" y2="16" />
        </svg>
        Calcular
      </button>
      <button data-t="peso">
        <svg viewBox="0 0 24 24"><path d="M4 19 9 11l4 4 3-5 4 9" /><circle cx="7" cy="6" r="2" /></svg>
        Peso
      </button>
      <button data-t="compras">
        <svg viewBox="0 0 24 24">
          <path d="M4 6h16l-1.5 11a2 2 0 0 1-2 1.7H7.5a2 2 0 0 1-2-1.7z" />
          <path d="M9 6V4.5A3 3 0 0 1 15 4.5V6" />
        </svg>
        Compras
      </button>
      </div>
    </nav>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
